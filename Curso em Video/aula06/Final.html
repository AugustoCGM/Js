<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Capture dados: Utilize o comando window.prompt para pedir ao usuário dois números.

        Converta os tipos: Como o prompt retorna uma string, converta esses valores para números 
        usando Number() ou Number.parseFloat().

        Calcule e exiba: Realize a soma desses valores e utilize o window.alert ou document.write 
        para mostrar o resultado final.-->

    <script>
        var n1 = Number(window.prompt('Digite o primeiro número:'));
        var n2 = Number(window.prompt('Digite o segundo número:'));
        var s = n1 + n2;

        document.write(`A soma entre ${n1} e ${n2} é igual a: ${s}`);
    </script>
</body>
</html>
