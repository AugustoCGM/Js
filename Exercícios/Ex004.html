    <script>
       var nome = window.prompt('Olá, qual é o seu nome?');
       window.confirm('Certo, então seu nome é ' + nome + '?');
       window.alert('Prazer em te conhecer, ' + nome + '!');
       document.write(`Prazer em te conhecer, <strong> ${nome}</strong>! Seu nome tem ${nome.length.toFixed(2).replace(7, 'sete')} letras.</br>`); 
        document.write(`Seu nome em maiúsculas é: <strong> ${nome.toUpperCase()}</strong>! </br>`);
        document.write(`Seu nome em minúsculas é: <strong> ${nome.toLowerCase()}</strong>! </br>`);
    </script>
